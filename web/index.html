<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shade Router</title>
    <meta name="description" content="Walking directions that keep you in the shade around Fortitude Valley." />
    <meta name="theme-color" content="#FAFAF8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cpattern id='h' width='4' height='4' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'%3E%3Cpath d='M0 0v4' stroke='%2326282A' stroke-width='1.4'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='%23FAFAF8'/%3E%3Cpath d='M4 28 20 4h8L12 28z' fill='url(%23h)'/%3E%3Cpath d='M6 26 26 6' stroke='%23D7322C' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!-- Start the data and tile fetches while the 300 KB bundle is still downloading. -->
    <link rel="preload" href="%BASE_URL%data/graph.json" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%data/shade.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  </head>
  <body>
    <div id="map"></div>
    <div id="three" hidden></div>
    <div id="map-tools">
      <button id="north" class="tool" aria-label="Point the map north">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 17 13H7z" fill="#D7322C" /><path d="M12 21 7 13h10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
      </button>
      <button id="view-toggle" class="tool" aria-pressed="false" aria-label="3D view">3D</button>
    </div>
    <section id="sheet" aria-label="Route">
      <div class="title-block">
        <h1 id="title">Shade Router</h1>
        <span id="stamp">21 Nov 2026</span>
      </div>
      <div id="pick">
        <div class="fields">
          <label class="field"><span class="dot from" aria-hidden="true"></span><span class="sr">From</span>
            <input id="from" type="text" autocomplete="off" enterkeyhint="search" placeholder="Start" aria-controls="suggest" /></label>
          <label class="field"><span class="dot to" aria-hidden="true"></span><span class="sr">To</span>
            <input id="to" type="text" autocomplete="off" enterkeyhint="search" placeholder="Where to? Search or tap the map" aria-controls="suggest" /></label>
          <button id="swap" type="button" aria-label="Swap start and destination">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M8 4 4 8M8 4l4 4M16 20V4M16 20l-4-4M16 20l4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <div id="suggest" hidden></div>
      </div>
      <div id="results" aria-live="polite"><p class="headline">Loading map data…</p></div>
      <p id="notice" role="status" hidden></p>
      <label class="slider" for="time"><span>Leave at</span><output id="time-label"></output></label>
      <input id="time" type="range" min="0" max="50" step="1" />
      <details id="hunger">
        <summary><span>Shade hunger</span><output id="alpha-label"></output></summary>
        <input id="alpha" type="range" min="0" max="10" step="1" value="5" aria-label="Shade hunger" />
        <p class="hint">Higher walks further for shade.</p>
      </details>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
